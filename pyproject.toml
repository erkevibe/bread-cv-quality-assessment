[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bread-cv-quality-assessment"
version = "0.1.0"
description = "Reproducible RGB computer-vision assessment of bread size and shape"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "AUTHOR_NAME"}]
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "pillow>=10.4,<12",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
cnn = ["torch>=2.4,<3", "torchvision>=0.19,<1"]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/breadcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}
